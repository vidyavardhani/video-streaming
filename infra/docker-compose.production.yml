# Production: app + MongoDB (branch: production)
# From repo root: docker compose -f infra/docker-compose.production.yml up -d
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      BASE_URL: http://localhost:4000
      MONGO_URI: mongodb://mongo:27017/video-streaming
      JWT_SECRET: KO2N2FNnKe4a4pcxAVR5yIlsqG5jgsAfPDqIJedOTqU
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data_prod:

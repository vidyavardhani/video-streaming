# CI/CD – Development (canonical: infra/cicd/development.yml)
name: CI – Development

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

env:
  NODE_VERSION: '20'
  DEPLOY_ENV: development
  COMPOSE_FILE: infra/docker-compose.development.yml

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify start
        run: timeout 5 npm start || true

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            video-streaming:development-${{ github.sha }}
            video-streaming:development-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-compose:
    name: Docker Compose (validate)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} config --quiet

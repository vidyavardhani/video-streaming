# Nginx Configuration for Video Upload Application
# Place this in /etc/nginx/sites-available/video-streaming

server {
    listen 80;
    server_name your-domain.com;  # Replace with your domain or IP

    # Allow large file uploads (5GB)
    client_max_body_size 5G;
    
    # Increase timeouts for large uploads
    client_body_timeout 600s;
    client_header_timeout 600s;
    send_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Proxy to Node.js application
    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        
        # WebSocket support for Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Forward real IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase buffer sizes for large uploads
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Static files (optional optimization)
    location /public {
        proxy_pass http://localhost:4000/public;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Error pages
    error_page 413 @error413;
    location @error413 {
        return 413 '{"error": "File too large. Maximum size is 5GB."}';
        add_header Content-Type application/json;
    }
}

# SSL Configuration (recommended for production)
server {
    listen 443 ssl http2;
    server_name your-domain.com;  # Replace with your domain

    # SSL certificates (use Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    
    # SSL optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow large file uploads (5GB)
    client_max_body_size 5G;
    
    # Increase timeouts for large uploads
    client_body_timeout 600s;
    client_header_timeout 600s;
    send_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Proxy to Node.js application
    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        
        # WebSocket support for Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Forward real IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase buffer sizes for large uploads
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Static files (optional optimization)
    location /public {
        proxy_pass http://localhost:4000/public;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Error pages
    error_page 413 @error413;
    location @error413 {
        return 413 '{"error": "File too large. Maximum size is 5GB."}';
        add_header Content-Type application/json;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$server_name$request_uri;
}

